[build-system]
requires = ["uv_build>=0.8.15,<0.12"]
build-backend = "uv_build"

[project]
name = "homeharvest-mcp"
version = "2.0.0"
description = "US property data via SQL. An MCP server over HomeHarvest (Realtor.com listings) with a local DuckDB cache."
readme = "README.md"
license = "MIT"
authors = [{ name = "Zachary Hampton", email = "zachary@bunsly.com" }]
requires-python = ">=3.10"
keywords = ["mcp", "real-estate", "sql", "duckdb", "homeharvest", "realtor"]
dependencies = [
    "homeharvest>=0.8.18,<0.10",
    "mcp[cli]>=1.13,<2",
    "smithery>=0.4.4,<0.5",
    "sqlglot>=27,<31",
    "duckdb>=1.2,<3",
    "pyyaml>=6",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
homeharvest-mcp = "homeharvest_mcp.server:main"
dev = "smithery.cli.dev:main"
playground = "smithery.cli.playground:main"

[tool.smithery]
server = "homeharvest_mcp.server:create_server"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits Realtor.com over the network (run with -m live)"]
addopts = "-m 'not live'"
